databaseChangeLog:

  - changeSet:
      id: 010-create-customers
      author: sakusan

      createTable:
        tableName: customers
        columns:

          - column:
              name: customer_id
              type: BIGINT
              autoIncrement: true
              constraints:
                primaryKey: true
                nullable: false

          - column:
              name: first_name
              type: VARCHAR(100)
              constraints:
                nullable: false

          - column:
              name: last_name
              type: VARCHAR(100)
              constraints:
                nullable: false

          - column:
              name: email
              type: VARCHAR(255)
              constraints:
                nullable: false
                unique: true

          - column:
              name: password_hash
              type: VARCHAR(255)
              constraints:
                nullable: false

          - column:
              name: phone
              type: VARCHAR(30)

          - column:
              name: active
              type: BOOLEAN
              defaultValueBoolean: true
              constraints:
                nullable: false

          - column:
              name: created_at
              type: TIMESTAMP WITH TIME ZONE
              defaultValueDate: CURRENT_TIMESTAMP
              constraints:
                nullable: false

          - column:
              name: updated_at
              type: TIMESTAMP WITH TIME ZONE
              defaultValueDate: CURRENT_TIMESTAMP
              constraints:
                nullable: false
  - changeSet:
      id: 011-add-constraints-customers
      author: sakusan
      changes:
        - createIndex:
            tableName: customers
            indexName: idx_customers_email
            columns:
              - column:
                  name: email