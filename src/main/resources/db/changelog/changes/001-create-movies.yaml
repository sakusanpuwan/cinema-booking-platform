databaseChangeLog:
  - changeSet:
      id: 001-create-movies
      author: sakusan
      changes:
        - createTable:
            tableName: movies
            columns:
              - column:
                  name: movie_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: poster_link
                  type: VARCHAR(500)
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: released_year
                  type: SMALLINT
              - column:
                  name: certificate
                  type: VARCHAR(20)
              - column:
                  name: runtime_minutes
                  type: VARCHAR(20)
              - column:
                  name: genre
                  type: VARCHAR(255)
              - column:
                  name: imdb_rating
                  type: NUMERIC(3,1)
              - column:
                  name: overview
                  type: TEXT
              - column:
                  name: meta_rating
                  type: SMALLINT
              - column:
                  name: director
                  type: VARCHAR(255)
              - column:
                  name: star1
                  type: VARCHAR(255)
              - column:
                  name: star2
                  type: VARCHAR(255)
              - column:
                  name: star3
                  type: VARCHAR(255)
              - column:
                  name: star4
                  type: VARCHAR(255)
              - column:
                  name: no_of_votes
                  type: INTEGER
              - column:
                  name: gross
                  type: NUMERIC(15,2)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-movie-indexes
      author: sakusan
      changes:
        - createIndex:
            tableName: movies
            indexName: idx_movies_title
            columns:
              - column:
                  name: title