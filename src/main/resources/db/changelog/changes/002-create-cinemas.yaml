databaseChangeLog:

  - changeSet:
      id: 003-create-cinemas
      author: sakusan

      createTable:
        tableName: cinemas

        columns:
          - column:
              name: cinema_id
              type: BIGINT
              autoIncrement: true
              constraints:
                primaryKey: true
                nullable: false

          - column:
              name: name
              type: VARCHAR(150)
              constraints:
                nullable: false

          - column:
              name: address_line1
              type: VARCHAR(255)
              constraints:
                nullable: false

          - column:
              name: address_line2
              type: VARCHAR(255)

          - column:
              name: city
              type: VARCHAR(100)
              constraints:
                nullable: false

          - column:
              name: postcode
              type: VARCHAR(20)

          - column:
              name: country
              type: VARCHAR(100)
              constraints:
                nullable: false

          - column:
              name: phone
              type: VARCHAR(30)

          - column:
              name: timezone
              type: VARCHAR(50)
              defaultValue: "Europe/London"
              constraints:
                nullable: false

          - column:
              name: active
              type: BOOLEAN
              defaultValueBoolean: true
              constraints:
                nullable: false

          - column:
              name: created_at
              type: TIMESTAMP WITH TIME ZONE
              defaultValueDate: CURRENT_TIMESTAMP
              constraints:
                nullable: false

          - column:
              name: updated_at
              type: TIMESTAMP WITH TIME ZONE
              defaultValueDate: CURRENT_TIMESTAMP
              constraints:
                nullable: false