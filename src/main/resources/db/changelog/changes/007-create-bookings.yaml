databaseChangeLog:

  - changeSet:
      id: 012-create-bookings
      author: sakusan

      createTable:
        tableName: bookings
        columns:

          - column:
              name: booking_id
              type: BIGINT
              autoIncrement: true
              constraints:
                primaryKey: true
                nullable: false

          - column:
              name: customer_id
              type: BIGINT
              constraints:
                nullable: false

          - column:
              name: showtime_id
              type: BIGINT
              constraints:
                nullable: false

          - column:
              name: status
              type: VARCHAR(20)
              defaultValue: PENDING
              constraints:
                nullable: false

          - column:
              name: total_amount
              type: NUMERIC(10,2)
              constraints:
                nullable: false

          - column:
              name: expires_at
              type: TIMESTAMP WITH TIME ZONE

          - column:
              name: created_at
              type: TIMESTAMP WITH TIME ZONE
              defaultValueDate: CURRENT_TIMESTAMP
              constraints:
                nullable: false

          - column:
              name: updated_at
              type: TIMESTAMP WITH TIME ZONE
              defaultValueDate: CURRENT_TIMESTAMP
              constraints:
                nullable: false
  - changeSet:
      id: 013-add-constraints-bookings
      author: sakusan
      changes:
        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: customer_id
            referencedTableName: customers
            referencedColumnNames: customer_id
            constraintName: fk_bookings_customer

        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: showtime_id
            referencedTableName: showtimes
            referencedColumnNames: showtime_id
            constraintName: fk_bookings_showtime

        - createIndex:
            tableName: bookings
            indexName: idx_bookings_customer
            columns:
              - column:
                  name: customer_id

        - createIndex:
            tableName: bookings
            indexName: idx_bookings_showtime
            columns:
              - column:
                  name: showtime_id

        - createIndex:
            tableName: bookings
            indexName: idx_bookings_status
            columns:
              - column:
                  name: status