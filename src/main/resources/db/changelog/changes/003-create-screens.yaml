databaseChangeLog:

  - changeSet:
      id: 004-create-screens
      author: sakusan

      createTable:
        tableName: screens

        columns:
          - column:
              name: screen_id
              type: BIGINT
              autoIncrement: true
              constraints:
                primaryKey: true
                nullable: false

          - column:
              name: cinema_id
              type: BIGINT
              constraints:
                nullable: false

          - column:
              name: screen_number
              type: SMALLINT
              constraints:
                nullable: false

          - column:
              name: name
              type: VARCHAR(100)

          - column:
              name: screen_type
              type: VARCHAR(30)
              constraints:
                nullable: false

          - column:
              name: total_seats
              type: INTEGER
              constraints:
                nullable: false

          - column:
              name: active
              type: BOOLEAN
              defaultValueBoolean: true
              constraints:
                nullable: false

          - column:
              name: created_at
              type: TIMESTAMP WITH TIME ZONE
              defaultValueDate: CURRENT_TIMESTAMP
              constraints:
                nullable: false

          - column:
              name: updated_at
              type: TIMESTAMP WITH TIME ZONE
              defaultValueDate: CURRENT_TIMESTAMP
              constraints:
                nullable: false
  - changeSet:
      id: 005-add-constraints-screens
      author: sakusan
      changes:
        - addForeignKeyConstraint:
            baseTableName: screens
            baseColumnNames: cinema_id
            referencedTableName: cinemas
            referencedColumnNames: cinema_id
            constraintName: fk_screens_cinema

        - addUniqueConstraint:
            tableName: screens
            columnNames: cinema_id,screen_number
            constraintName: uk_screen_cinema_number